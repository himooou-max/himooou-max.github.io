let detailScrollPending=false;
function updateDetailScroll(){
 const detail=$('#projectDetail');if(!detail||detail.hidden)return;
 detail.style.setProperty('--detail-viewport',document.documentElement.clientWidth+'px');
 detail.style.setProperty('--scroll-cue-opacity',String(1-clamp(scrollY/100)));
 detail.style.setProperty('--scroll-cue-visibility',scrollY>=100?'hidden':'visible');
 const panel=detail.querySelector('.detail-overview');if(!panel)return;
 // Tall copy finishes scrolling into view before it stays behind the gallery.
 const pin=Math.min(80,innerHeight-panel.offsetHeight-32);
 detail.style.setProperty('--overview-pin',pin+'px');
 const panelTop=panel.getBoundingClientRect().top,gallery=detail.querySelector('.wire-gallery');
 const progress=clamp((innerHeight-panelTop)/Math.max(1,innerHeight-80));
 const eased=progress*progress*(3-2*progress);
 const cover=gallery?clamp((innerHeight-gallery.getBoundingClientRect().top)/Math.max(1,innerHeight-pin)):0;
 const coverEase=cover*cover*(3-2*cover);
 const dim=Math.min(1,eased*.78+coverEase*.22);
 detail.style.setProperty('--cover-dim',String(dim));
 const headerBase=(detail.querySelector('[data-hero-color]')?.dataset.heroColor||'0,0,0').split(',').map(Number);
 document.body.style.setProperty('--detail-header-color','rgb('+headerBase.map(c=>Math.round(c*(1-dim))).join(',')+')');
 detail.style.setProperty('--panel-opacity',String((.45+.55*clamp(progress/.75))*(1-coverEase)));

}
function requestDetailScroll(){if(detailScrollPending)return;detailScrollPending=true;requestAnimationFrame(()=>{detailScrollPending=false;updateDetailScroll()})}
