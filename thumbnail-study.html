<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>썸네일 전환 — Motion Study</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#e1e1e1;color:#242424;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}header{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;font-size:11px;letter-spacing:.06em}header a{color:inherit;text-decoration:none}header b{font-weight:500}button,select{font:inherit;color:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}.stage{min-height:calc(100svh - 170px);display:grid;place-items:center;padding:12px 0 28px}.card{position:relative;width:min(420px,68vw,calc((100svh - 220px)*.8));aspect-ratio:4/5;background:#f1f1f1;border-radius:5%;overflow:hidden;display:grid;place-items:center}.thumb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;object-fit:contain;width:auto;height:auto;max-width:65%;max-height:63%;opacity:1;animation:none;transition:none}.toolbar{padding:0 4vw 26px;display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:11px}.buttons{display:flex;gap:8px;align-items:center}.buttons button,.buttons a,.buttons label,select{border:1px solid #aaa;background:transparent;padding:9px 12px;border-radius:5px;text-decoration:none;cursor:pointer;white-space:nowrap}.buttons .primary{background:#222;color:white;border-color:#222}select{font-size:11px}.counter{font-variant-numeric:tabular-nums;min-width:68px;text-align:center}.note{font-size:10px;line-height:1.7;color:#73736d}.note strong{font-weight:400;color:#252525}#file{display:none}body.capture header,body.capture .toolbar{display:none}body.capture .stage{height:100svh;min-height:0;padding:0}body.capture .card{width:min(80vw,80svh)}button:focus-visible,a:focus-visible,select:focus-visible,label:focus-within{outline:2px solid #333;outline-offset:3px}.load{font-size:11px;color:#888}#status{display:block;min-height:16px} @media(max-width:700px){header{height:64px;padding:0 6vw}.stage{min-height:calc(100svh - 240px)}.card{width:min(70vw,calc((100svh - 270px)*.8))}.toolbar{padding:0 6vw 22px;flex-direction:column;align-items:start;gap:18px}.buttons{gap:5px;flex-wrap:wrap}.buttons button,.buttons a,.buttons label,select{padding:8px;font-size:10px}.note{font-size:9px}}
</style></head><body><header><b>THUMBNAIL / MOTION STUDY</b><a href="./">인트로 시안 ↗</a></header><main class="stage"><div class="card" aria-label="고정된 프레임 안에서 이미지만 교체되는 썸네일"><img id="thumb" class="thumb" alt="" hidden><span class="load" id="loading">이미지 준비 중</span></div></main><footer class="toolbar"><div class="note"><strong>고정 프레임 · 탄성 있는 교체 · 이미지 비율 변화</strong><br>레퍼런스에서 추출한 테스트 이미지 12개 / 실제 포트폴리오 이미지 교체 전<span id="status" role="status"></span></div><div class="buttons"><button id="prev" aria-label="이전 화면">←</button><button id="play" class="primary">일시정지</button><button id="next" aria-label="다음 화면">→</button><span id="counter" class="counter" aria-live="off">01 / 12</span><select id="speed" aria-label="화면 교체 간격"><option value="375">원본 리듬 · 0.375초</option><option value="500">0.5초</option><option value="750">0.75초</option></select><label for="file">이미지 교체<input id="file" type="file" multiple accept="image/*"></label><a href="thumbnail-loop.mp4" download="thumbnail-loop.mp4">기본 시안 MP4 ↓</a><button id="capture" aria-label="영상 영역만 보기">영역만 보기</button></div></footer><script>
const examples=[{"src": "thumbnail-assets/01.jpg", "width": 389, "height": 474}, {"src": "thumbnail-assets/02.jpg", "width": 389, "height": 390}, {"src": "thumbnail-assets/03.jpg", "width": 389, "height": 294}, {"src": "thumbnail-assets/04.jpg", "width": 389, "height": 390}, {"src": "thumbnail-assets/05.jpg", "width": 389, "height": 390}, {"src": "thumbnail-assets/06.jpg", "width": 389, "height": 474}, {"src": "thumbnail-assets/07.jpg", "width": 389, "height": 390}, {"src": "thumbnail-assets/08.jpg", "width": 389, "height": 390}, {"src": "thumbnail-assets/09.jpg", "width": 389, "height": 390}, {"src": "thumbnail-assets/10.jpg", "width": 389, "height": 390}, {"src": "thumbnail-assets/11.jpg", "width": 350, "height": 480}, {"src": "thumbnail-assets/12.jpg", "width": 350, "height": 480}];const $=s=>document.querySelector(s);let frames=examples,index=0,elapsed=0,playing=!matchMedia('(prefers-reduced-motion:reduce)').matches,interval=375,last=performance.now(),ready=false,urls=[];
function draw(){const f=frames[index];$('#thumb').src=f.src;$('#thumb').alt=`썸네일 ${index+1} / ${frames.length}`;$('#counter').textContent=String(index+1).padStart(2,'0')+' / '+String(frames.length).padStart(2,'0');$('#play').textContent=playing?'일시정지':'재생'}
async function preload(list){await Promise.all(list.map(f=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve();i.onerror=reject;i.src=f.src})));}
function step(d){index=(index+d+frames.length)%frames.length;elapsed=0;draw()}
function tick(now){const dt=Math.min(now-last,100);last=now;if(playing&&ready&&!document.hidden){elapsed+=dt;const steps=Math.floor(elapsed/interval);if(steps){elapsed%=interval;index=(index+steps)%frames.length;draw()}}const u=Math.min(1,elapsed/320),scale=matchMedia('(prefers-reduced-motion:reduce)').matches||u>=1?1:1-.065*Math.exp(-4*u)*Math.cos(10*u);$('#thumb').style.transform=`translate(-50%,-50%) scale(${scale})`;requestAnimationFrame(tick)}
$('#play').onclick=()=>{playing=!playing;draw()};$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);$('#speed').onchange=e=>{interval=Number(e.target.value);elapsed=0};$('#capture').onclick=()=>document.body.classList.add('capture');document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('capture');if(['SELECT','INPUT'].includes(document.activeElement.tagName))return;if(e.code==='Space'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();playing=!playing;draw()}if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});document.addEventListener('visibilitychange',()=>last=performance.now());
$('#file').onchange=async e=>{const files=Array.from(e.target.files);if(!files.length)return;if(files.length>50||files.some(f=>!f.type.startsWith('image/')||f.size>20*1024*1024)){$('#status').textContent='이미지를 최대 50개, 파일당 20MB 이하로 선택해 주세요.';return}const next=files.map(f=>({src:URL.createObjectURL(f),name:f.name}));try{await preload(next);urls.forEach(URL.revokeObjectURL);urls=next.map(f=>f.src);frames=next;index=0;elapsed=0;draw();$('#status').textContent=`${files.length}개 이미지를 선택한 순서대로 재생합니다. MP4 다운로드는 기본 시안입니다.`}catch{next.forEach(f=>URL.revokeObjectURL(f.src));$('#status').textContent='일부 이미지를 읽지 못했습니다. 다른 이미지로 다시 선택해 주세요.'}};
preload(frames).then(()=>{ready=true;$('#thumb').hidden=false;$('#loading').hidden=true;draw()}).catch(()=>$('#loading').textContent='이미지를 불러오지 못했습니다. 새로고침해 주세요.');draw();requestAnimationFrame(tick);
</script></body></html>
